<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>英単語学習</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>英単語学習</h1>

<!-- メニュー画面 -->
<div id="menu-screen">
  <button onclick="startFlashcardMode()">単語帳モード</button>
  <button onclick="startDictionaryMode()">辞書モード</button>
</div>

<!-- 単語帳モード -->
<div id="flashcard-screen">
  <button class="back-button" onclick="showMenu()">← メニューに戻る</button>
  <div class="flashcard-info">
    <span id="flashcard-count"></span>
  </div>
  <div class="flashcard" id="flashcard" onclick="toggleFlashcard()">
    クリックして開始
  </div>
  <div class="flashcard-controls">
    <button onclick="previousFlashcard()" id="prev-btn">← 前へ</button>
    <button onclick="nextFlashcard()" id="next-btn">次へ →</button>
  </div>
</div>

<!-- 辞書モード -->
<div id="dictionary-screen">
  <button class="back-button" onclick="showMenu()">← メニューに戻る</button>
  <table>
    <thead>
      <tr><th>English</th><th>Japanese</th></tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script src="app.js"></script>

</body>
</html>
