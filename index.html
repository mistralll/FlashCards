<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>英単語学習</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; }
    
    /* メニュー画面 */
    #menu-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px 20px;
    }
    
    #menu-screen button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
      width: 200px;
    }
    
    #menu-screen button:hover {
      background: #0056b3;
    }
    
    /* 単語帳モード */
    #flashcard-screen {
      display: none;
      text-align: center;
    }
    
    .flashcard {
      border: 2px solid #333;
      padding: 40px;
      margin: 20px 0;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      cursor: pointer;
      background: #f9f9f9;
      border-radius: 10px;
      transition: all 0.3s;
    }
    
    .flashcard:hover {
      background: #f0f0f0;
      transform: scale(1.02);
    }
    
    .flashcard.flipped {
      background: #e8f4f8;
    }
    
    .flashcard-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }
    
    .flashcard-controls button {
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      background: #28a745;
      color: white;
      border-radius: 5px;
    }
    
    .flashcard-controls button:hover {
      background: #218838;
    }
    
    .flashcard-info {
      margin: 20px 0;
      color: #666;
    }
    
    /* 辞書モード */
    #dictionary-screen {
      display: none;
    }
    
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    
    /* 共通 */
    .back-button {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 16px;
      background: #6c757d;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    
    .back-button:hover {
      background: #5a6268;
    }
  </style>
</head>
<body>

<h1>英単語学習</h1>

<!-- メニュー画面 -->
<div id="menu-screen">
  <button onclick="startFlashcardMode()">単語帳モード</button>
  <button onclick="startDictionaryMode()">辞書モード</button>
</div>

<!-- 単語帳モード -->
<div id="flashcard-screen">
  <button class="back-button" onclick="showMenu()">← メニューに戻る</button>
  <div class="flashcard-info">
    <span id="flashcard-count"></span>
  </div>
  <div class="flashcard" id="flashcard" onclick="toggleFlashcard()">
    クリックして開始
  </div>
  <div class="flashcard-controls">
    <button onclick="previousFlashcard()" id="prev-btn">← 前へ</button>
    <button onclick="nextFlashcard()" id="next-btn">次へ →</button>
  </div>
</div>

<!-- 辞書モード -->
<div id="dictionary-screen">
  <button class="back-button" onclick="showMenu()">← メニューに戻る</button>
  <table>
    <thead>
      <tr><th>English</th><th>Japanese</th></tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script src="app.js"></script>

</body>
</html>
